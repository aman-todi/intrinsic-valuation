# Local dev: throwaway Postgres 16 + Redis, api, worker, frontend. Migrate once with
#   docker compose run --rm api alembic upgrade head
# Production is different: infra/deploy/docker-compose.prod.yml (caddy + api + worker + redis on EC2,
# Postgres on AWS RDS, images from ECR) with the frontend on Vercel; see docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile.api }
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/postgres
      # Docker Desktop on Apple M4/M5 advertises SME/SVE to the VM; OpenSSL bundled in `cryptography`
      # then dies with SIGILL on import. Local only: Graviton (production) has neither feature.
      - OPENSSL_armcap=0
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile.worker }
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/postgres
      - OPENSSL_armcap=0 # see api
    init: true
    stop_grace_period: 90s # > WORKER_SHUTDOWN_GRACE_SECONDS (60)
    depends_on: [db, redis]
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
        # Empty client id = dev auth bypass (needs DEV_AUTH_BYPASS=true on the API).
        - NEXT_PUBLIC_COGNITO_DOMAIN=${NEXT_PUBLIC_COGNITO_DOMAIN:-}
        - NEXT_PUBLIC_COGNITO_CLIENT_ID=${NEXT_PUBLIC_COGNITO_CLIENT_ID:-}
        - NEXT_PUBLIC_COGNITO_USER_POOL_ID=${NEXT_PUBLIC_COGNITO_USER_POOL_ID:-}
        - NEXT_PUBLIC_COGNITO_REGION=${NEXT_PUBLIC_COGNITO_REGION:-}
    ports: ["3000:3000"]
    depends_on: [api]
