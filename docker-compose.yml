# Local dev. Postgres is the real (free-tier) Supabase project from .env — no local DB container.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile.api }
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    ports: ["8000:8000"]
    depends_on: [redis]
  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile.worker }
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on: [redis]
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
