name: deploy
# Build the arm64 api + worker images, push them to ECR (tagged with the commit SHA) and roll them out
# on the EC2 host via SSM Run Command (infra/scripts/deploy.sh -> /opt/dcf/deploy.sh). See
# docs/DEPLOYMENT.md. The frontend is deployed by Vercel's own Git integration, not here.
#
# AWS credentials (Terraform variable github_deploy_auth): either the secrets AWS_ACCESS_KEY_ID +
# AWS_SECRET_ACCESS_KEY of the IAM user dcf-github-deploy ("access_key"), or AWS_DEPLOY_ROLE_ARN, assumed
# through OIDC ("oidc"). Disabled until the repository variable DEPLOY_ENABLED is 'true' (set it after
# `terraform apply`, put_ssm_params.sh and the secrets), so pushes to main stay green before AWS exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}

jobs:
  skipped:
    if: ${{ vars.DEPLOY_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deployment not enabled
        run: >-
          echo "::notice title=Deploy skipped::AWS deploy is disabled. After terraform apply +
          infra/scripts/put_ssm_params.sh, add the AWS deploy secrets and set the repository
          variable DEPLOY_ENABLED=true (see docs/DEPLOYMENT.md)."

  build:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    # Native arm64 GitHub-hosted runner. Set the repository variable ARM_RUNNER=ubuntu-latest to build
    # under QEMU emulation instead (slower) if arm64 runners are not available to this repository.
    runs-on: ${{ vars.ARM_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # OIDC -> AWS (github_deploy_auth = "oidc" only)
    strategy:
      fail-fast: true
      matrix:
        image: [api, worker]
    steps:
      - name: Check required configuration
        env:
          HAS_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
          HAS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          if [ "$HAS_ROLE" != "true" ] && [ "$HAS_KEYS" != "true" ]; then
            echo "::error title=Deploy misconfigured::set the secrets AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (IAM user dcf-github-deploy) or AWS_DEPLOY_ROLE_ARN (OIDC); see docs/DEPLOYMENT.md A5"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Empty role = use the access key as is; a role ARN = assume it through OIDC.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: dcf-build-${{ matrix.image }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (only on non-arm64 runners)
        if: ${{ runner.arch != 'ARM64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build and push dcf-${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.image }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/dcf-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: dcf-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 (SSM Run Command)
        run: infra/scripts/deploy.sh --skip-build --tag "${{ github.sha }}"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA::12}\`"
            echo "Images \`dcf-api:${GITHUB_SHA}\` and \`dcf-worker:${GITHUB_SHA}\` (linux/arm64) in ${AWS_REGION}."
          } >> "$GITHUB_STEP_SUMMARY"
