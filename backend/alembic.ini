# Alembic config (spec §9.2). The database URL is NOT set here; alembic/env.py uses, in order:
#   1. `-x dburl=...` on the command line,
#   2. `sqlalchemy.url` if set programmatically (Config.set_main_option, used by tests),
#   3. app.config.settings.DATABASE_URL (the DIRECT, non-pooled connection).
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
