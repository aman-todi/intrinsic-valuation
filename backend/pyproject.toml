[project]
name = "dcf-backend"
version = "0.1.0"
description = "DCF valuation platform — API + worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.128,<0.140",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0.35,<2.1",
  "psycopg[binary,pool]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "saq[redis]>=0.26,<0.27",
  "redis>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "xlsxwriter>=3.2.9,<4.0",
  "openpyxl>=3.1,<4.0",
  "weasyprint>=66,<71",
  "jinja2>=3.1,<4.0",
  "matplotlib>=3.9,<4.0",
  "pandas>=2.3.3,<3.0",
  "numpy>=2.1,<3.0",
  "scipy>=1.16,<1.17",
  "xlrd>=2.0,<3.0",
  "anthropic>=0.75,<1.0",
  "yfinance>=1.0,<2.0",
  "boto3>=1.35,<2.0",
  "python-jose[cryptography]>=3.3,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "freezegun>=1.5",
  "pypdf>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "fakeredis[lua]>=2.26",
  "testcontainers[postgres,redis]>=4.8",
  "moto[s3]>=5.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.export.pdf" = ["templates/*.jinja"]
"app.data.macro" = ["*.json"]
"app.data.demo" = ["edgar/*.json", "edgar/*.xml", "edgar/*.htm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: needs Postgres/Redis or external binaries",
  "soffice: needs LibreOffice on PATH",
  "real_excel_verify: run-pipeline test that keeps the real LibreOffice recalc verification",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's asyncio layer runs ORM code inside greenlets; without this, code reached through
# `await session...` in routes/jobs is under-reported.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
